version: 2
updates:
  # Workflow actions are where a supply-chain problem would hurt most.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
    groups:
      vscode:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]

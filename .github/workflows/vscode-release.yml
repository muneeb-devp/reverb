name: vscode-release

# Push a tag like vscode-v0.1.0 to publish the VS Code extension to the Visual Studio Marketplace
# (trusted publishing, no token) and Open VSX (token) and attach the .vsix to a GitHub release. The tag's version must match
# vscode/package.json. Running it by hand builds and packages the extension without publishing.
on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub release
  id-token: write  # lets the job prove to the Marketplace which workflow it is (trusted publishing)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vscode/package-lock.json

      - name: Check the tag matches package.json
        id: version
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#vscode-v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::The tag $GITHUB_REF_NAME is for version $tag, but vscode/package.json says $pkg. Change the version in vscode/package.json to $tag, or tag it as vscode-v$pkg."
              exit 1
            fi
          fi
          echo "Version: $pkg"

      # Only for a release: a run by hand only packages, which works with the placeholder.
      - name: Check the publisher is set
        if: github.event_name == 'push'
        shell: bash
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          if [[ "$publisher" == REPLACE-* ]]; then
            echo "::error::vscode/package.json still has the placeholder publisher '$publisher'. Set it to the Marketplace publisher id before releasing."
            exit 1
          fi

      # The extension's integration tests run against the CLI built here. ci.yml runs the whole
      # suite on all three OSes for the same commit; this is a last check before publishing.
      # This also installs frontend/node_modules (the Reverb.Server project runs npm ci there on a
      # fresh checkout), which the extension's renderer needs.
      - name: Build the CLI
        working-directory: .
        run: dotnet build src/Reverb.Cli -c Release

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

      - name: Integration tests
        env:
          REVERB_CONFIGURATION: Release
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: reverb-vsix-${{ steps.version.outputs.version }}
          path: vscode/reverb-notebooks-${{ steps.version.outputs.version }}.vsix

      - name: Publish to the Visual Studio Marketplace
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # No token: --oidc exchanges this run's GitHub identity for a 15-minute Marketplace credential.
        # It needs the trusted publishing policy described in vscode/PUBLISHING.md.
        run: npx vsce publish --oidc --packagePath "reverb-notebooks-$VERSION.vsix"

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT isn't set, so the extension wasn't published to Open VSX. See vscode/PUBLISHING.md."
            exit 0
          fi
          npx ovsx publish "reverb-notebooks-$VERSION.vsix" -p "$OVSX_PAT"

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: .
        shell: bash
        run: |
          flags=(--generate-notes --title "Reverb for VS Code $VERSION")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "vscode/reverb-notebooks-$VERSION.vsix" "${flags[@]}"
